<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos Ward</title>
<style>
/* Chaos Ward: Stil "Siegel"
   Regeln: eine Schriftfamilie (Overpass), kantige Formen (2 px), dünne Linien.
   Farben tragen Bedeutung: Grünblau = gewählt / Schutz an. Gold = nur ein Treffer. Rot = verboten / Fehler.
   Blau = Zahlen aus dem Spiel. Sonst nur Kohle und Stein. */
@font-face { font-family: "Overpass"; src: url(fonts/Overpass-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Overpass"; src: url(fonts/Overpass-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Overpass"; src: url(fonts/Overpass-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Overpass"; src: url(fonts/Overpass-Bold.ttf); font-weight: 700; }

:root {
  --bg: #121314;      /* Grund */
  --side: #0E0F10;    /* Seitenleiste */
  --s1: #17181A;      /* Fläche */
  --s2: #1E1F22;      /* angehoben */
  --s3: #27292C;      /* Knöpfe */
  --line: #2A2C30;    /* Haarlinie */
  --line2: #3A3D42;
  --ink: #E7E3DB;     /* Text, warmes Steinweiß */
  --ash: #9A968E;     /* Nebentext */
  --dim: #66635D;
  --ward: #4FAE9B;    /* gewählt / Schutz an */
  --ward-hi: #8AD4C3;
  --ward-lo: #1B3631;
  --ward-a: rgba(79,174,155,.10);
  --ward-ink: #0B1A17;
  --hit: #D6A640;     /* nur Treffer */
  --hit-hi: #F0CF7A;
  --hit-a: rgba(214,166,64,.12);
  --val: #A3A8FF;     /* Zahlen wie im Spiel */
  --bad: #D4604E;
  --bad-a: rgba(212,96,78,.10);
  --r: 2px;
  --sans: "Overpass", "Segoe UI", system-ui, sans-serif;
  --cond: var(--sans);
  --mono: var(--sans);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--s1); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 9px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--ward); }
input::placeholder { color: var(--dim); }
input[type=range] { padding: 0; border: 0; background: transparent; accent-color: var(--ward); }
:focus-visible { outline: 1px solid var(--ward-hi); outline-offset: 2px; }
::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-thumb { background: var(--s3); border: 2px solid var(--bg); }
.muted { color: var(--ash); } small { font-size: 12px; }
b, strong { font-weight: 600; }
kbd { font: 500 11px var(--mono); color: var(--ash); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: var(--r); padding: 0 5px; }
.lbl, h3.sec { font: 600 14px/1.25 var(--sans); color: var(--ink); }

.app { display: grid; grid-template-columns: 212px 1fr; height: 100vh; }

/* ---------- Seitenleiste ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 0 12px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 16px 22px; }
.brand img { width: 36px; height: 36px; }
.brand b { font: 700 17px/1 var(--sans); display: block; }
.brand small { color: var(--dim); font-size: 11px; line-height: 1.3; display: block; margin-top: 4px; }
.nav { display: flex; flex-direction: column; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 9px 16px; color: var(--ash); font-weight: 500; font-size: 14.5px; text-align: left; border-left: 2px solid transparent; }
.nav button:hover { color: var(--ink); background: var(--s1); }
.nav button.on { color: var(--ink); background: var(--s2); border-left-color: var(--ward); }
.nav svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on svg { color: var(--ward-hi); }
.nav .sep { height: 1px; background: var(--line); margin: 10px 16px; }

/* Schutz-Feld: Zustand, Zahl, Knopf */
.guard { margin: auto 12px 0; padding: 12px 12px 12px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); }
.guard-top { display: flex; align-items: center; gap: 8px; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.guard.on .lamp { background: var(--ward); box-shadow: 0 0 0 3px var(--ward-a); }
.guard.hit .lamp { background: var(--hit); box-shadow: 0 0 0 3px var(--hit-a); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.guard-top b { font-weight: 600; font-size: 13.5px; color: var(--ash); }
.guard.on .guard-top b { color: var(--ward-hi); } .guard.hit .guard-top b { color: var(--hit-hi); }
.guard-top kbd { margin-left: auto; }
.reel { display: flex; align-items: baseline; gap: 7px; margin: 12px 0 0; }
.reel b { font: 700 30px/1 var(--sans); color: var(--ink); }
.reel span { color: var(--ash); font-size: 12.5px; line-height: 1.25; }
.guard.hit .reel b { color: var(--hit-hi); }
.guard-cap { display: none; }
.guard-btn { width: 100%; margin-top: 12px; padding: 8px; border-radius: var(--r); font-weight: 600; background: var(--ward); color: var(--ward-ink); }
.guard-btn:hover { background: var(--ward-hi); }
.guard.on .guard-btn, .guard.hit .guard-btn { background: var(--s3); color: var(--ink); }
.guard.on .guard-btn:hover, .guard.hit .guard-btn:hover { background: var(--line2); }

/* ---------- Hauptbereich ---------- */
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.page { display: none; flex: 1; min-height: 0; flex-direction: column; } .page.on { display: flex; }
.head { display: flex; align-items: flex-end; gap: 16px; padding: 20px 24px 15px; border-bottom: 1px solid var(--line); flex: none; }
.head h1 { font: 700 22px/1.15 var(--sans); }
.head p { color: var(--ash); margin-top: 4px; max-width: 72ch; }
.head .grow { flex: 1; }
.body { flex: 1; min-height: 0; display: flex; }
.scroll { overflow: auto; min-height: 0; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); }
h3.sec { margin: 0 0 10px; }
.hint { color: var(--ash); font-size: 12.5px; }

/* Schalter, Reiter, Knöpfe */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-bottom: 1px solid var(--line2); }
.seg button { padding: 7px 10px 8px; color: var(--ash); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--ink); border-bottom-color: var(--ward); }
.chip { padding: 4px 10px; border-radius: var(--r); color: var(--ash); border: 1px solid var(--line2); font-size: 13px; white-space: nowrap; }
.chip:hover { color: var(--ink); border-color: var(--ash); }
.chip.on { color: var(--ward-hi); border-color: var(--ward); background: var(--ward-a); }
.btn { padding: 8px 14px; border-radius: var(--r); font-weight: 600; background: var(--ward); color: var(--ward-ink); }
.btn:hover { background: var(--ward-hi); }
.btn.quiet { background: var(--s3); color: var(--ink); }
.btn.quiet:hover { background: var(--line2); }
.link { color: var(--ash); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line2); }
.link:hover { color: var(--bad); text-decoration-color: currentColor; }
.sw { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.sw:first-of-type { border-top: 0; }
.sw > span { flex: 1; min-width: 0; } .sw > span small { display: block; color: var(--ash); font-size: 12.5px; margin-top: 1px; }
.tg { width: 34px; height: 18px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line2); position: relative; flex: none; cursor: pointer; transition: background .12s, border-color .12s; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 1px; background: var(--dim); transition: left .12s, background .12s; }
.on > .tg, .tg.on { background: var(--ward-lo); border-color: var(--ward); } .on > .tg::after, .tg.on::after { left: 18px; background: var(--ward-hi); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 28px; height: 28px; border-radius: var(--r); background: var(--s3); font: 500 16px var(--mono); }
.stepper button:hover { background: var(--line2); }
.stepper b { min-width: 22px; text-align: center; font: 600 16px var(--mono); }

/* ---------- Mods wählen ---------- */
.cats { width: 194px; flex: none; border-right: 1px solid var(--line); padding: 14px 10px; }
.cats input { width: 100%; margin-bottom: 8px; }
.grp > button { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 9px 8px 4px; color: var(--ash); font-size: 13px; font-weight: 500; }
.grp > button:hover { color: var(--ink); }
.grp .chev { transition: transform .15s; font-family: var(--sans); } .grp.open .chev { transform: rotate(90deg); }
.grp .items { display: none; } .grp.open .items { display: block; }
.cat { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 5px 8px; border-radius: var(--r); font-size: 14px; text-align: left; gap: 6px; border-left: 2px solid transparent; }
.cat em { font-style: normal; color: var(--ash); font-size: 12px; }
.cat:hover { background: var(--s1); }
.cat.on { background: var(--s2); border-left-color: var(--ward); }
.cat .badge { min-width: 18px; padding: 0 4px; border-radius: var(--r); background: var(--ward-lo); color: var(--ward-hi); font: 600 11px/17px var(--mono); text-align: center; }

.mods { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.filt { display: flex; gap: 6px; padding: 12px 18px 10px; align-items: center; flex-wrap: wrap; }
.filt input { width: 180px; padding: 4px 9px; margin-left: auto; }
.filt .count { color: var(--dim); font: 500 12px var(--mono); margin-left: 4px; }
.list { padding: 0 18px 18px; }
.secl { color: var(--ash); font: 600 13px var(--sans); padding: 14px 12px 6px; }
.mod { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r); border-left: 2px solid transparent; cursor: pointer; }
.mod + .mod { margin-top: 1px; }
.mod:hover { background: var(--s1); }
.mod .tx { color: var(--ink); font-size: 14.5px; }
.mod .tx i { font-style: normal; color: var(--val); font-weight: 600; font-variant-numeric: tabular-nums; }
.chk { width: 16px; height: 16px; border-radius: var(--r); border: 1.5px solid var(--line2); display: grid; place-items: center; }
.mod:hover .chk { border-color: var(--ash); }
.mod.on { background: var(--ward-a); border-left-color: var(--ward); }
.mod.on .chk { background: var(--ward); border-color: var(--ward); }
.mod.on .chk::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--ward-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.tiers { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; max-width: 230px; }
.tiers b { min-width: 25px; padding: 1px 0; text-align: center; border-radius: var(--r); font: 500 11px/1.5 var(--mono); color: var(--dim); border: 1px solid var(--line); cursor: pointer; }
.tiers b:hover { color: var(--ink); border-color: var(--ash); }
.mod.on .tiers b { color: var(--ash); }
.tiers b.rng { color: var(--ward-hi) !important; background: var(--ward-a); border-color: var(--ward-lo); }
.tiers b.sel { color: var(--ward-ink) !important; background: var(--ward); border-color: var(--ward); font-weight: 600; }
.tiers .val { color: var(--ward-hi); font: 500 11.5px var(--mono); padding: 2px 4px; }
.empty { color: var(--ash); padding: 40px 10px; text-align: center; }

/* Deine Jagd: die Liste, die das Siegel prüft */
.slip > *, .rside > * { flex: none; }
.slip { width: 276px; flex: none; border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.ticket { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); }
.ticket .band { padding: 11px 14px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ticket h3 { font: 600 13px var(--sans); color: var(--ash); }
.ticket .sub { font-size: 13px; color: var(--ink); font-weight: 500; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket ul { list-style: none; padding: 6px 0; display: flex; flex-direction: column; }
.ticket li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 14px; font-size: 13.5px; line-height: 1.3; color: var(--ink); }
.ticket li b { flex: none; font: 500 11px var(--mono); color: var(--ward-hi); border: 1px solid var(--ward-lo); border-radius: var(--r); padding: 1px 5px; }
.ticket li.ban { color: var(--bad); text-decoration: line-through; text-decoration-color: rgba(212,96,78,.55); }
.ticket .none { color: var(--ash); font-size: 13px; padding: 10px 14px; }
.ticket .rule { padding: 10px 14px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ash); }
.ticket .rule strong { color: var(--ink); }
.ticket .rule .seg { margin-top: 8px; }
.ticket .rule .stepper { margin-top: 10px; display: flex; justify-content: center; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tiles div { background: var(--s1); padding: 9px 12px; }
.tiles b { display: block; font: 600 18px/1.2 var(--mono); }
.tiles span { color: var(--ash); font-size: 11.5px; }

/* ---------- Mageblood ---------- */
.legs { flex: 1; padding: 16px 22px; }
.legs .seg { max-width: 340px; margin-bottom: 16px; }
.leggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(218px, 1fr)); gap: 6px; }
.leg { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); border-left: 2px solid var(--line); }
.leg.on { border-left-color: var(--ward); background: var(--ward-a); }
.gem { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--line2); }
.leg .nm { flex: 1; font-weight: 500; min-width: 0; } .leg .nm small { display: block; color: var(--bad); font-weight: 400; font-size: 11.5px; }
.leg .st { display: flex; align-items: center; gap: 3px; }
.leg .st button { width: 24px; height: 24px; border-radius: var(--r); background: var(--s3); font: 500 14px var(--mono); }
.leg .st button:hover { background: var(--line2); }
.leg .st b { min-width: 26px; text-align: center; font: 600 13px var(--mono); color: var(--dim); }
.leg.on .st b { color: var(--ward-hi); }
.leg.ban { border-left-color: var(--bad); background: var(--bad-a); }
.leg.ban .gem { filter: grayscale(1) brightness(.6); } .leg.ban .nm { text-decoration: line-through; color: var(--ash); }
.leg.off { opacity: .5; }
.leg .x { padding: 2px 8px; border-radius: var(--r); border: 1px solid var(--line2); font-size: 12px; color: var(--ash); }
.leg.ban .x { border-color: var(--bad); color: var(--bad); }
.rside { width: 300px; flex: none; border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.slot { height: 46px; border-radius: var(--r); border: 1px dashed var(--line2); display: grid; place-items: center; font-size: 11.5px; color: var(--dim); text-align: center; padding: 2px; }
.slot.f { border: 1px solid var(--line2); border-bottom: 2px solid var(--c, var(--ward)); color: var(--ink); font-weight: 500; background: var(--s1); }
.field { display: flex; align-items: center; gap: 10px; }
.field input { width: 80px; font-family: var(--mono); }

/* ---------- Divine ---------- */
.dvl-wrap { flex: 1; padding: 16px 24px; }
.dv-item { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; }
.dv-item svg, .dvempty svg { width: 34px; height: 34px; flex: none; fill: none; stroke: var(--ash); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.dv-item b { font: 600 18px var(--cond); display: block; }
.dv-item small { color: var(--ash); }
.dv-item .grow { flex: 1; }
.dl { padding: 13px 0; border-top: 1px solid var(--line); }
.dl .tx { color: var(--ink); font-size: 14.5px; }
.dl .tx em { font-style: normal; color: var(--val); font-weight: 600; font-variant-numeric: tabular-nums; }
.dn { display: grid; grid-template-columns: auto 1fr 34px 80px; gap: 12px; align-items: center; margin-top: 8px; }
.dn .rng { min-width: 0; }
.dn .rng small { color: var(--dim); display: flex; justify-content: space-between; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rbox { position: relative; height: 20px; }
.rbox .dbar { position: absolute; left: 6px; right: 6px; top: 9px; margin: 0; }
.rbox input[type=range] { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 20px; margin: 0; background: transparent; cursor: pointer; }
.rbox input[type=range]::-webkit-slider-runnable-track { height: 20px; background: transparent; }
.rbox input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 18px; margin-top: 1px; border-radius: 1px; background: var(--ward-hi); border: 1px solid var(--bg); }
.dn.off .rbox input[type=range]::-webkit-slider-thumb { background: var(--dim); }
.dbar { position: relative; height: 2px; background: var(--line2); }
.dbar u { position: absolute; top: 0; bottom: 0; background: var(--ward); }
.dbar i { position: absolute; top: -5px; width: 2px; height: 12px; background: var(--ink); }
.dn .op { height: 30px; border-radius: var(--r); background: var(--s3); font: 600 15px var(--mono); color: var(--ink); }
.dn input[type=number] { width: 80px; text-align: center; font: 600 14px var(--mono); }
.dn.off .rng, .dn.off .op, .dn.off input[type=number] { opacity: .4; }
.dn.onn input[type=number] { border-color: var(--ward); color: var(--ward-hi); }
.dvempty { display: grid; place-items: center; text-align: center; padding: 64px 20px; gap: 14px; color: var(--ash); }
.dvempty svg { width: 64px; height: 64px; stroke-width: 1; }
.dvempty b { color: var(--ink); font: 600 19px var(--cond); }
.qs { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Tracker ---------- */
.trk { flex: 1; padding: 18px 24px; display: flex; flex-direction: column; gap: 20px; }
.big4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.big4 div { background: var(--s1); padding: 13px 16px; }
.big4 b { display: block; font: 600 28px/1.1 var(--mono); }
.big4 div:first-child b { color: var(--ward-hi); }
.big4 span { color: var(--ash); font-size: 12px; }
.chartw { position: relative; padding: 24px 16px 12px; }
.chart { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 110px; border-bottom: 1px solid var(--line2); }
.chart .bar { position: relative; flex: 1; min-width: 6px; max-width: 28px; height: 100%; display: flex; align-items: flex-end; cursor: default; }
.chart .bar i { display: block; width: 100%; background: var(--s3); border-top: 2px solid var(--ward); transition: background .1s; }
.chart .bar:hover i { background: var(--ward-lo); }
.chart .bar b { position: absolute; left: 50%; transform: translateX(-50%); font: 500 11px var(--mono); color: var(--ash); white-space: nowrap; }
.chart .avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--dim); pointer-events: none; }
.chart .avg span { position: absolute; right: 0; top: -16px; font: 500 11px var(--mono); color: var(--ash); background: var(--s1); padding: 0 4px; }
.tip { position: fixed; z-index: 5; pointer-events: none; background: var(--side); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 9px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; }
.tip b { color: var(--ink); display: block; font-family: var(--mono); } .tip span { color: var(--ash); }
.hist { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: 120px 1fr auto; gap: 14px; padding: 8px 4px; border-top: 1px solid var(--line); }
.hrow span:first-child { color: var(--dim); font: 500 12.5px var(--mono); } .hrow span:nth-child(2) { color: var(--ink); }
.hrow b { font: 600 13px var(--mono); color: var(--ash); }

/* ---------- Einstellungen ---------- */
.set { flex: 1; padding: 18px 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; align-items: start; }
.set select { max-width: 230px; }
.set .panel { padding: 14px 16px 6px; }
.set .wide { grid-column: 1 / -1; }
.modes { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.opt { display: flex; gap: 12px; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line); border-left: 2px solid var(--line); cursor: pointer; }
.opt:hover { border-color: var(--line2); }
.opt .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line2); flex: none; margin-top: 3px; }
.opt.on { border-color: var(--ward-lo); border-left-color: var(--ward); background: var(--ward-a); } .opt.on .dot { border: 4px solid var(--ward); }
.opt b { display: block; } .opt span { color: var(--ash); font-size: 12.5px; }
.opt .tag, .tag { font: 600 11px var(--sans); color: var(--ward-hi); border: 1px solid var(--ward-lo); border-radius: var(--r); padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
.chiprow { display: flex; gap: 6px; flex-wrap: wrap; }
.plist { display: flex; flex-direction: column; gap: 4px; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line); border-left: 2px solid var(--ward); }
.pitem span { flex: 1; min-width: 0; } .pitem b { display: block; } .pitem small { color: var(--ash); }
.sysgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 10px; }
.sysi { display: flex; gap: 10px; padding: 9px 10px; border-radius: var(--r); background: var(--bg); border: 1px solid var(--line); }
.sysi i { font: 700 11px/18px var(--sans); font-style: normal; width: 18px; height: 18px; border-radius: var(--r); text-align: center; flex: none; border: 1px solid; }
.sysi.ok i { color: var(--ward-hi); border-color: var(--ward-lo); } .sysi.info i { color: var(--ash); border-color: var(--line2); } .sysi.bad i { color: var(--bad); border-color: var(--bad); }
.sysi.bad { border-color: rgba(212,96,78,.5); background: var(--bad-a); }
.sysi b { display: block; font-size: 13px; } .sysi small { color: var(--ash); font-size: 12px; line-height: 1.35; display: block; }
.sysi .chip { margin-top: 6px; }
textarea { width: 100%; height: 120px; resize: vertical; font: 13px Consolas, monospace; }
details summary { cursor: pointer; color: var(--ash); padding: 10px 0; }
details[open] summary { color: var(--ink); }

/* ---------- Hilfe ---------- */
.help { flex: 1; padding: 18px 24px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; align-content: start; }
.help .panel { padding: 16px 18px; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.step:first-of-type { border-top: 0; }
.step .n { width: 24px; height: 24px; border-radius: var(--r); border: 1px solid var(--ward-lo); color: var(--ward-hi); display: grid; place-items: center; font: 600 12px var(--mono); }
.step b { display: block; } .step span { color: var(--ash); }
ul.facts { padding-left: 16px; color: var(--ash); } ul.facts li { margin-bottom: 8px; } ul.facts li::marker { color: var(--dim); }

.toast { position: fixed; right: 20px; bottom: 18px; max-width: 420px; background: var(--s2); color: var(--ink); border: 1px solid var(--line2); border-left: 2px solid var(--ward); padding: 9px 14px; border-radius: var(--r); font-weight: 500; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 1120px) { .mod { grid-template-columns: 16px 1fr; row-gap: 6px; } .mod .tiers { grid-column: 2; justify-content: flex-start; max-width: none; } .filt input { width: 150px; } .slip { width: 244px; } .cats { width: 172px; } .rside { width: 270px; } .set { grid-template-columns: 1fr; } .big4 b { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

// ---------- Daten ----------
async function loadDB() {
  $("#list").innerHTML = `<div class="empty">${t("loading")}</div>`;
  try {
    const txt = await (await fetch("../Mods.tsv")).text();
    for (const line of txt.split(/\r?\n/)) {
      const f = line.split("\t");
      if (f[0] === "V") DB.ver = f[1];
      else if (f[0] === "G" && f.length >= 9)
        DB.groups[f[1]] = { id:f[1], kind:f[2], text:f[3], n:+f[4], tiers:f[6].split(";;").map(x => x.split("~")) };
      else if (f[0] === "C") {
        const c = { id:f[1], main:f[2], sub:f[3], gids:f[4].split(",").filter(g => g in DB.groups) };
        DB.cats.push(c); DB.byId[c.id] = c;
      }
    }
    loaded = true;
  } catch (e) { $("#list").innerHTML = `<div class="empty">${t("loadErr")}</div>`; }
}
const wishesOf = id => ST.wishes[id] || (ST.wishes[id] = {});
const needOf = id => +(ST.need[id] || 1);
const shortMod = s => String(s).replace(/\(\s*-?[\d.]+\s*[-–]\s*-?[\d.]+\s*\)%?/g, "").replace(/^[\s+%-]+/, "").replace(/\s+/g, " ").replace(/^(to|of) /, "").trim();
const rangeHi = s => esc(s).replace(/(\+?\(\s*-?[\d.]+\s*[-–]\s*-?[\d.]+\s*\)%?)/g, "<i>$1</i>");

function renderGuard() {

  $("#gState").textContent = t(ST.hit ? "gHit" : ST.on ? "gOn" : "gOff");
  $("#gKey").textContent = ST.key;
  $("#toggle").textContent = t(ST.hit ? "ctaHit" : ST.on ? "ctaOff" : "ctaOn");
  const dv = STATS.cur === "d", n = Math.max(0, +(dv ? STATS.dvSince : STATS.since) || 0);
  $("#gReel").innerHTML = `<b>${fmtN(n)}</b><span>${t(dv ? "gCapDv" : "gCap")}</span>`;
  $("#ver").textContent = `Version ${ST.ver || "?"} · ${ST.lang === "de" ? "Spieldaten" : "game data"} ${DB.ver || "?"}`;
}
function applyI18n() {
  document.documentElement.lang = ST.lang;
  $$("[data-i18n]").forEach(el => el.innerHTML = t(el.dataset.i18n));

  $("#facts").innerHTML = t("facts").map(f => `<li>${f}</li>`).join("");
}

// ---------- Mods wählen ----------
function renderSide() {
  const q = $("#catSearch").value.trim().toLowerCase(), groups = {}, act = DB.byId[ST.activeCat];
  DB.cats.forEach(c => { if (!q || (c.sub + " " + c.main).toLowerCase().includes(q)) (groups[c.main] = groups[c.main] || []).push(c); });
  if (!openGroup && act) openGroup = act.main;
  $("#side").innerHTML = Object.entries(groups).map(([main, cats]) => {
    const open = q || main === openGroup;
    return `<div class="grp${open ? " open" : ""}"><button data-g="${esc(main)}">${esc(main)}<span class="chev">›</span></button><div class="items">` +
      cats.map(c => { const n = Object.keys(wishesOf(c.id)).length;
        return `<button class="cat${c.id === ST.activeCat ? " on" : ""}" data-cat="${c.id}"><span>${esc(c.sub)}</span>${n ? `<span class="badge">${n}</span>` : ""}</button>`; }).join("") +
      `</div></div>`;
  }).join("") || `<div class="empty">${t("noMods")}</div>`;
}
function tierOf(cur) { cur = String(cur ?? ""); return cur === "" ? 99 : /^T\d+$/.test(cur) ? +cur.slice(1) : 0; }
function tierChips(g, on, cur) {
  const lim = on ? tierOf(cur) : 0, legacy = on && cur !== "" && !/^T\d+$/.test(String(cur));
  const lvl = {}; g.tiers.forEach(x => lvl[x[0]] = x[1]);
  let h = "";
  for (let k = 1; k <= g.n; k++) {
    const cls = on && !legacy ? (k === Math.min(lim, g.n) ? "sel" : k < lim ? "rng" : "") : "";
    h += `<b class="${cls}" data-tier="${k}" title="${esc(fmt("tierTitle", { t:"T" + k, l: lvl["T" + k] ?? "?" }))}">T${k}</b>`;
  }
  if (legacy) h += `<span class="val">${esc(fmt("valueMin", { v: cur }))}</span>`;
  return h;
}
function renderList() {
  const cat = DB.byId[ST.activeCat];
  if (!cat) { $("#list").innerHTML = `<div class="empty">${t(loaded ? "noCat" : "loading")}</div>`; $("#modCount").textContent = ""; return; }
  const w = wishesOf(cat.id), q = $("#search").value.trim().toLowerCase();
  let html = "", count = 0;
  for (const kind of ["P", "S"]) {
    if ((filter === "P" || filter === "S") && filter !== kind) continue;
    const rows = cat.gids.map(g => DB.groups[g]).filter(g => g.kind === kind && (filter !== "sel" || g.id in w) && (!q || g.text.toLowerCase().includes(q)));
    if (!rows.length) continue;
    count += rows.length;
    html += `<div class="secl">${t(kind === "P" ? "prefixes" : "suffixes")}</div>`;
    for (const g of rows) {
      const on = g.id in w;
      html += `<div class="mod${on ? " on" : ""}" data-gid="${g.id}"><span class="chk" data-box></span><span class="tx">${rangeHi(g.text)}</span><span class="tiers">${tierChips(g, on, w[g.id])}</span></div>`;
    }
  }
  $("#list").innerHTML = html || `<div class="empty">${t("noMods")}</div>`;
  $("#modCount").textContent = fmt("modsN", { n: count });
}
function tierLabel(g, cur) {
  cur = String(cur ?? "");
  if (cur === "") return t("tierAll");
  if (/^T\d+$/.test(cur)) return cur === "T1" ? "T1" : "T1–" + cur;
  return fmt("valueMin", { v: cur });

// ---------- Divine ----------
function dvState() { const d = ST.dv || (ST.dv = { item:"", any:0, lines:[], rules:{} }); if (!d.rules || Array.isArray(d.rules)) d.rules = {}; return d; }
const dvNum = x => x === "" || x == null ? null : +x;
function dvStep(n) { const all = [n.v, n.lo, n.hi].filter(x => x !== "" && x != null).map(String); return all.some(x => x.includes(".")) ? (all.some(x => /\.\d\d/.test(x)) ? 0.01 : 0.1) : 1; }
const dvFmt = v => (+v).toLocaleString(ST.lang, { maximumFractionDigits: 2 });
function dvText(text, idx) { let i = 0; return esc(text).replace(/-?\d+(?:\.\d+)?/g, m => (++i === idx || idx === -1 ? `<em>${m}</em>` : m)); }
function dvDefault(n) { const lo = dvNum(n.lo), hi = dvNum(n.hi), st = dvStep(n); if (lo == null || hi == null || lo === hi) return +n.v; return Math.round((lo + 0.8 * (hi - lo)) / st) * st; }
function renderDv() {
  const d = dvState(), box = $("#dvMain");
  if (!d.item || !d.lines.length) {
    box.innerHTML = `<div class="dvempty">${DVICON}<b>${t("dvEmptyT")}</b><div>${t("dvEmptyH")}</div>
      <button class="btn quiet" data-dvtake>${t("dvTake")}</button><div class="hint">${t("dvPasteH")}</div></div>`;
  } else {
    box.innerHTML = `<div class="dv-item">${DVICON}<div class="grow"><b>${esc(d.item.split("  ·  ")[0])}</b><small>${esc(d.item.split("  ·  ").slice(1).join(" · "))}${d.item.includes("  ·  ") ? " · " : ""}${t("dvItemH")}</small></div><button class="chip" data-dvtake>${t("dvTake")}</button></div>` +
      d.lines.map(L => { const rs = d.rules[L.key] || {};
        const nums = L.nums.map((n, i0) => { const i = i0 + 1, r = rs[i], lo = dvNum(n.lo), hi = dvNum(n.hi), st = dvStep(n), has = lo != null && hi != null && lo !== hi;
          const val = r ? +r.val : dvDefault(n), op = r ? r.op : ">=", pct = x => has ? Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100)) : 0;
          const good = has ? (op === ">=" ? `left:${pct(val)}%;right:0` : `left:0;right:${100 - pct(val)}%`) : "";
          return `<div class="dn${r ? " onn" : " off"}" data-k="${L.key}" data-i="${i}">
            <div class="tg${r ? " on" : ""}" data-act="tog" title="${L.nums.length > 1 ? "#" + i : ""}"></div>
            <div class="rng">${has ? `<div class="rbox"><div class="dbar">${r ? `<u style="${good}"></u>` : ""}<i style="left:calc(${pct(+n.v)}% - 1px)"></i></div><input type="range" min="${lo}" max="${hi}" step="${st}" value="${val}" data-act="rng"></div>
              <small><span>${dvFmt(lo)}</span><span>${t("dvCur")} ${dvFmt(n.v)}${L.nums.length > 1 ? " · #" + i : ""}</span><span>${dvFmt(hi)}</span></small>`
              : `<small>${lo != null && lo === hi ? t("dvFixed") : t("dvNoRange")} · ${t("dvCur")} ${dvFmt(n.v)}</small>`}</div>
            <button class="op" data-act="op" title="${op === ">=" ? t("dvMin") : t("dvMax")}">${op === ">=" ? "≥" : "≤"}</button>
            <input type="number" step="${st}" value="${val}" data-act="num"></div>`; }).join("");
        return `<div class="dl"><div class="tx">${dvText(L.text, -1)}</div>${nums}</div>`; }).join("");
  }
  $$("#dvAnySeg button").forEach(b => b.classList.toggle("on", +b.dataset.v === +(d.any || 0)));
  const li = [];
  for (const L of d.lines) for (const [i, r] of Object.entries(d.rules[L.key] || {}))
    li.push(`<li>${esc(shortMod(L.text.replace(/-?\d+(?:\.\d+)?/g, m => "(" + m + "-" + m + ")")))}<b>${r.op === ">=" ? "≥" : "≤"} ${dvFmt(r.val)}</b></li>`);
  $("#dvTicket").innerHTML = `<div class="band"><h3>${t("huntT")}</h3><div class="sub">${esc((d.item || "Divine").split("  ·  ")[0])}</div></div>` +
    (li.length ? `<ul>${li.join("")}</ul>` : `<div class="none">${t("dvNone")}</div>`) + `<div class="rule">${t(+d.any ? "dvRuleOne" : "dvRuleAll")}</div>`;
}
function dvSet(key, i, op, val) { const d = dvState(); d.rules[key] = d.rules[key] || {};
  if (val === null) { delete d.rules[key][i]; if (!Object.keys(d.rules[key]).length) delete d.rules[key]; post("dvRule", key, i, op, ""); }
  else { val = Math.round(val * 100) / 100; d.rules[key][i] = { op, val }; post("dvRule", key, i, op, val); } }
function dvFind(el) { const r = el.closest(".dn"); if (!r) return null; const d = dvState(), L = d.lines.find(x => x.key === r.dataset.k);
  return L ? { L, i: +r.dataset.i, n: L.nums[+r.dataset.i - 1], r: (d.rules[L.key] || {})[+r.dataset.i] } : null; }

  const txt = (e.clipboardData || window.clipboardData).getData("text"); if (!txt) return; e.preventDefault(); post("dvPaste", txt.replace(/\r/g, "")); });
$("#dvAnySeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; dvState().any = +b.dataset.v; post("dvAny", b.dataset.v); renderDv(); };
$$("[data-top]").forEach(b => b.onclick = () => { const d = dvState(), v = b.dataset.top, anyOn = Object.keys(d.rules).length > 0;
  for (const L of d.lines) L.nums.forEach((n, i0) => { const i = i0 + 1, r = (d.rules[L.key] || {})[i];
    if (v === "off") { if (r) dvSet(L.key, i, r.op, null); return; }
    if (anyOn && !r) return; const lo = dvNum(n.lo), hi = dvNum(n.hi); if (lo == null || hi == null || lo === hi) return;
    const st = dvStep(n), op = r ? r.op : ">=", q = +v, x = op === ">=" ? lo + q * (hi - lo) : hi - q * (hi - lo);
    dvSet(L.key, i, op, Math.round(x / st) * st); });
  renderDv(); });

$$(".sw[data-k]").forEach(s => s.onclick = e => { if (e.target.closest("button")) return; const k = s.dataset.k; ST[k] = +ST[k] ? 0 : 1;
  post("set", k[0].toUpperCase() + k.slice(1), ST[k]); renderSettings(); });
$("#keySel").onchange = e => { const v = e.target.value; if (v === "__rec") { recordKey(); return; } post("set", "Key", v); };
// eigene Taste aufnehmen: nächste Taste (mit Strg/Alt/Shift) oder Maustaste 3/4/5; Esc bricht ab
function recordKey() {
  toast(t("keyRecHint"), true);
  const done = () => { removeEventListener("keydown", onKey, true); removeEventListener("mousedown", onMouse, true); removeEventListener("mouseup", stop, true); renderSettings(); };
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  const mods = e => (e.ctrlKey ? "^" : "") + (e.altKey ? "!" : "") + (e.shiftKey ? "+" : "");
  const onKey = e => {
    stop(e);
    if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
    if (e.key === "Escape") { toast(t("keyRecCancel")); done(); return; }
    const c = e.code; let k = "";
    if (/^F([1-9]|1\d|2[0-4])$/.test(c)) k = c;
    else if (/^Key[A-Z]$/.test(c)) k = c.slice(3).toLowerCase();
    else if (/^Digit\d$/.test(c)) k = c.slice(5);
    else if (/^Numpad/.test(c)) k = c;
    else if (["Insert", "Home", "End", "PageUp", "PageDown", "Delete", "Pause", "ScrollLock"].includes(c)) k = c.replace("PageUp", "PgUp").replace("PageDown", "PgDn");
    if (!k) { toast(t("keyRecBad"), true); return; }
    if (/^[a-z0-9]$/.test(k) && !(e.ctrlKey || e.altKey || e.shiftKey)) { toast(t("keyNeedMod"), true); return; }
    post("set", "Key", mods(e) + k); done();
  };
  const onMouse = e => {
    const k = { 1: "MButton", 3: "XButton1", 4: "XButton2" }[e.button];
    if (!k) return;
    stop(e); post("set", "Key", mods(e) + k); done();
  };
  addEventListener("keydown", onKey, true); addEventListener("mousedown", onMouse, true); addEventListener("mouseup", stop, true);
}

let rulesT; $("#rules").oninput = () => { clearTimeout(rulesT); rulesT = setTimeout(() => { ST.rules = $("#rules").value; post("rules", ST.rules.replace(/\r/g, "")); renderHunt(); }, 500); };
$("#uninstall").onclick = () => post("uninstall");

// Nachrichten von AutoHotkey
try {
  window.chrome.webview.addEventListener("message", e => {
    const m = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    if (m.type === "state") { Object.assign(ST, m); if (!DB.byId[ST.activeCat] && DB.cats[0]) ST.activeCat = DB.cats[0].id; renderAll(); }
    else if (m.type === "status") { ST.on = m.on; ST.hit = m.hit; renderGuard(); }
    else if (m.type === "cat") selectCat(m.id, true);
    else if (m.type === "saved") toast(t("saved"));
    else if (m.type === "stats") { STATS = m; renderStats(); }
    else if (m.type === "ocr") { ST.ocr = m.ocr; renderOcr(); }
    else if (m.type === "sys") { SYS = m.items || []; renderSys(); }
    else if (m.type === "page") showPage(m.id);
    else if (m.type === "prot") { PROT = m.items || []; renderProt(); }
    else if (m.type === "dv") { ST.dv = m.dv; renderDv(); }
    else if (m.type === "toast") toast(m.text, +m.long);
  });
} catch (e) {}

(async () => {
  renderAll();
  await loadDB();
  if (!DB.byId[ST.activeCat] && DB.cats[0]) ST.activeCat = DB.cats[0].id;
  renderAll();
  post("ready");
})();
</script>
